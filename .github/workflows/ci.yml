name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      # The tests talk to a real HTTP server on localhost (tests/Support/server.php), not a fake of the HTTP client.
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress
        if: matrix.php == '8.4'
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
        if: matrix.php == '8.4'

  # The lowest versions the constraints allow: a `^1.19` that really needs 1.20 is found here, not by a user.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  # What `composer require` serves, not this repository: the archive is installed into a throwaway project that has only a
  # PSR-18 client, and used. It also checks the archive leaves the tests out and that no client at all gives a message that helps.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - run: sh tests/Packaging/run.sh
